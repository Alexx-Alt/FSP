name: fsp-match-v6

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fsp_match_v6
      MYSQL_USER: ${DB_USERNAME:-fsp_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Задайте MYSQL_ROOT_PASSWORD в .env}
    volumes:
      - fsp_main_db:/var/lib/mysql
      - ./database/fsp_match_v6:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  private-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fsp_match_private
      MYSQL_USER: ${PRIVATE_DB_USERNAME:-fsp_private}
      MYSQL_PASSWORD: ${PRIVATE_DB_PASSWORD:?Задайте PRIVATE_DB_PASSWORD в .env}
      MYSQL_ROOT_PASSWORD: ${PRIVATE_MYSQL_ROOT_PASSWORD:?Задайте PRIVATE_MYSQL_ROOT_PASSWORD в .env}
    volumes:
      - fsp_private_db:/var/lib/mysql
      - ./database/private:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      private-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_NAME: "ИТ-MATCH PRO"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fsp_match_v6
      DB_USERNAME: ${DB_USERNAME:-fsp_app}
      DB_PASSWORD: ${DB_PASSWORD}
      PRIVATE_DB_HOST: private-db
      PRIVATE_DB_PORT: 3306
      PRIVATE_DB_DATABASE: fsp_match_private
      PRIVATE_DB_USERNAME: ${PRIVATE_DB_USERNAME:-fsp_private}
      PRIVATE_DB_PASSWORD: ${PRIVATE_DB_PASSWORD}
      SESSION_DRIVER: file
      SESSION_ENCRYPT: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  fsp_main_db:
  fsp_private_db:
