name: tests

on:
  push:
    branches:
      - main
      - feature/fsp-match-v6-analytics
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare CI application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$(pwd)/database/database.sqlite" php artisan migrate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        id: frontend_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee frontend-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload frontend build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: frontend-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Run CI Checks
        run: composer ci:check

      - name: Verify FSP PHP syntax
        run: |
          php -l app/Http/Controllers/JuryDemoController.php
          php -l app/Http/Controllers/EmployerJobsController.php
          php -l app/Http/Controllers/CandidateSettingsController.php
          php -l app/Http/Controllers/ComparisonController.php
          php -l app/Http/Controllers/InteractionController.php
          php -l app/Services/Fsp/AnalyticsService.php
          php -l app/Services/Fsp/MatchEngine.php
          php -l app/Services/Fsp/LiveAssessmentService.php
          php -l routes/web.php
          php -l routes/console.php
