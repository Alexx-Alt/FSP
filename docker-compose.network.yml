services:
  app:
    environment:
      APP_NAME: "ИТ-МЕТЧ"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Задайте APP_URL в .env}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      TRUSTED_PROXIES: "*"
    expose:
      - "8000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "0.0.0.0:${PUBLIC_PORT:-80}:80"
    volumes:
      - ./docker/nginx/network.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
